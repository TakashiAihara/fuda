name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Nothing here writes to the API or pushes. Public repository, so the default
# token is broader than the job needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suites build their database from the migrations, so a schema.ts that no
  # longer matches them goes unnoticed by every test. Needs no database, and is
  # its own job so a failing lint or test cannot hide drift.
  migrations:
    name: migrations match schema.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: scripts/check-migrations.sh

  check:
    name: types, lint, format, unit and integration tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fuda
          POSTGRES_PASSWORD: fuda
          # Named for what it is. These suites drop the public schema, and the
          # guard in apps/server/src/db/disposable.ts refuses to run against a
          # database that is not obviously disposable.
          POSTGRES_DB: fuda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuda -d fuda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # The same script a person runs before pushing, so the two cannot drift.
      - run: bun run check
        env:
          FUDA_TEST_DATABASE_URL: postgres://fuda:fuda@localhost:5432/fuda_test

  e2e:
    name: the screen, driven in a browser
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fuda
          POSTGRES_PASSWORD: fuda
          POSTGRES_DB: fuda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fuda -d fuda_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Playwright version
        id: playwright
        run: |
          set -euo pipefail
          version=$(bunx playwright --version | cut -d' ' -f2)
          test -n "$version" || { echo "could not read the Playwright version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Only the browser download is cached. The system packages --with-deps
      # installs are not under this path, so the install below still runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
        env:
          FUDA_TEST_DATABASE_URL: postgres://fuda:fuda@localhost:5432/fuda_test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  compose:
    name: docker compose up is healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # The claim in the README is that one invocation brings fuda up. That is
      # only true for as long as something keeps checking it.
      - run: docker compose up -d --build --wait --wait-timeout 300

      - name: the server answers
        run: |
          set -euo pipefail
          response=$(curl -fsS http://localhost:8787/health)
          echo "$response"
          test "$response" = '{"status":"ok","database":"ok"}'

      - name: the screen is served from the same origin
        run: |
          set -euo pipefail
          page=$(curl -fsS http://localhost:8787/)
          # The source index.html has the same root element, so only fetching a
          # built asset shows that the bundle, not the template, is being served.
          asset=$(printf '%s' "$page" | grep -o -m 1 '/assets/[^"]*\.js')
          test -n "$asset"
          curl -fsS -o /dev/null "http://localhost:8787$asset"

      - name: the migration ran
        run: |
          set -euo pipefail
          docker compose exec -T db psql -U fuda -d fuda -tAc \
            "select count(*) from pg_extension where extname = 'pg_trgm'" | grep -qx 1

      - if: failure()
        run: docker compose logs --no-color

      - if: always()
        run: docker compose down -v
