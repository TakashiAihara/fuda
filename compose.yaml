name: fuda

# One invocation brings up everything: `docker compose up`.
# Every value below can be overridden from the environment, because nothing
# here may assume a particular host, port or platform.

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${FUDA_DB_USER:-fuda}
      POSTGRES_PASSWORD: ${FUDA_DB_PASSWORD:-fuda}
      POSTGRES_DB: ${FUDA_DB_NAME:-fuda}
    volumes:
      # postgres:18 moved PGDATA to /var/lib/postgresql/18/docker and declares
      # the volume one level up. Mounting the old /var/lib/postgresql/data
      # would appear to work and persist nothing.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${FUDA_DB_USER:-fuda} -d ${FUDA_DB_NAME:-fuda}']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  server:
    build: .
    environment:
      # Taken whole, never assembled here. Building a URL out of separate user
      # and password values breaks the moment a password contains @, /, ? or #,
      # and it breaks on this side only — PostgreSQL will have accepted the
      # password. An unencoded @ is the worst of them: it parses to a different
      # host rather than failing.
      #
      # Change FUDA_DB_USER, FUDA_DB_PASSWORD or FUDA_DB_NAME above and this has
      # to be set to match, percent-encoded.
      FUDA_DATABASE_URL: ${FUDA_DATABASE_URL:-postgres://fuda:fuda@db:5432/fuda}
      FUDA_PORT: ${FUDA_PORT:-8787}
      FUDA_BASE_URL: ${FUDA_BASE_URL:-http://localhost:${FUDA_PUBLISH_PORT:-8787}}
      FUDA_PERSON_IDENTITY: ${FUDA_PERSON_IDENTITY:-person}
    ports:
      - '${FUDA_PUBLISH_PORT:-8787}:${FUDA_PORT:-8787}'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Reads the port from the environment rather than repeating it, so
      # overriding FUDA_PORT does not leave the check knocking on the old one.
      # bun is the one runtime guaranteed to be in this image, so the check
      # does not depend on curl or wget being present.
      test:
        [
          'CMD',
          'bun',
          '-e',
          'const r = await fetch(`http://localhost:$${process.env.FUDA_PORT}/health`).catch(() => null); process.exit(r?.ok ? 0 : 1)',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  db-data:
